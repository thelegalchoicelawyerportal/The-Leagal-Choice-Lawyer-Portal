<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | The Legal Choice</title><link rel="stylesheet" href="portal.css"><style>
.reset-wrap{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.reset-card{
    width:100%;
    max-width:450px;
    background:#fff;
    padding:35px;
    border-radius:14px;
    box-shadow:0 15px 45px rgba(0,0,0,.12);
}

.reset-brand{
    text-align:center;
    margin-bottom:25px;
}

.reset-brand img{
    width:70px;
    height:70px;
    object-fit:contain;
}

.reset-brand h1{
    margin:12px 0 5px;
}

.reset-brand p{
    margin:0;
    color:#777;
    letter-spacing:1px;
}

.reset-card h2{
    margin-bottom:8px;
}

.reset-card .intro{
    color:#777;
    margin-bottom:25px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-weight:600;
}

.field input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
    box-sizing:border-box;
}

.reset-message{
    display:none;
    margin:15px 0;
    padding:12px 14px;
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
}

.reset-message.error{
    display:block;
    background:rgba(180,40,40,.10);
    border:1px solid rgba(180,40,40,.30);
    color:#a52828;
}

.reset-message.success{
    display:block;
    background:rgba(30,130,80,.10);
    border:1px solid rgba(30,130,80,.30);
    color:#23784d;
}

.btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}
</style></head><body><div class="reset-wrap"><div class="reset-card"><div class="reset-brand"><img src="assets/logo.png" alt="The Legal Choice Logo"><h1>The Legal Choice</h1><p>JUSTICE · TRUST · SUPPORT</p></div><h2>Set New Password</h2><p class="intro">
Create a new password for your The Legal Choice admin account.
</p><form id="resetForm"><div class="field"><label for="password">
New Password
</label><input
id="password"
type="password"
required
minlength="6"
autocomplete="new-password"
placeholder="Enter new password"

«»

</div><div class="field"><label for="confirmPassword">
Confirm New Password
</label><input
id="confirmPassword"
type="password"
required
minlength="6"
autocomplete="new-password"
placeholder="Confirm new password"

«»

</div><div
id="resetMessage"
class="reset-message"
role="alert">
</div><button
class="btn gold"
id="updateButton"
type="submit">
Update Password
</button>

</form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
"https://ibzxisfangonytpknthu.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_S0YKbX1MIaBB9HxL5KoEAw_X0mymq8q";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const resetForm =
document.getElementById("resetForm");

const passwordInput =
document.getElementById("password");

const confirmPasswordInput =
document.getElementById("confirmPassword");

const updateButton =
document.getElementById("updateButton");

const resetMessage =
document.getElementById("resetMessage");


function showMessage(message,type){

    resetMessage.textContent = message;

    resetMessage.className =
        "reset-message " + type;
}


resetForm.addEventListener(
"submit",
async function(e){

    e.preventDefault();

    resetMessage.className =
        "reset-message";

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }


    updateButton.disabled = true;

    updateButton.textContent =
        "Updating Password...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.updateUser({
            password: password
        });


        if(error){

            throw error;

        }


        showMessage(
            "Password updated successfully. You can now login with your new password.",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "portal-login.html";

            },
            1800
        );


    }catch(error){

        console.error(
            "Password update error:",
            error
        );

        showMessage(
            error.message ||
            "Unable to update password. Please try the recovery link again.",
            "error"
        );

    }finally{

        updateButton.disabled = false;

        updateButton.textContent =
            "Update Password";

    }

});

</script></body>
</html>
